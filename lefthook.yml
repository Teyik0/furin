pre-commit:
  # Top-level jobs run sequentially. `files format` rewrites and re-stages files
  # first, so the parallel checks and `react doctor --staged` always see the
  # final commit content instead of racing the formatter.
  jobs:
    - name: files format
      run: bun run fix
      stage_fixed: true

    - name: checks
      group:
        parallel: true
        jobs:
          - name: typescript check
            run: bun run tscheck

          - name: knip
            run: bun run knip

    - name: react doctor
      # Offline + staged: the supply-chain scan (Socket.dev) and the score API
      # are network calls that can hang a commit; the project wildcard keeps
      # React-aware rules enabled for staged files across the monorepo.
      run: bunx react-doctor --staged --project "*" --no-score --no-supply-chain --verbose

pre-push:
  jobs:
    - name: Build
      run: bun run build

    - name: Test
      run: bun run test

commit-msg:
  commands:
    lint-commit-message:
      run: bun run commitlint --edit {1}
