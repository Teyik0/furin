[run]
bun = true

[test]
root = "./tests"
preload = ["./tests/setup/global.ts", "./tests/setup/process-state.ts"]
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = [
  "**/tests/**",
  "**/fixtures/**/*",
  "**/internal.ts", # __setCompileContext is only called from generated compile entries (subprocess)
  "**/dev-page-plugin.ts", # Bun.plugin callbacks run in subprocess only — covered by dev-hmr integration test
  "**/.tmp-tests/**", # Temporary apps created by CLI/build integration tests
  "**/private/var/**",  # macOS temp files
  "**/var/folders/**", # macOS temp files (symlink)
  "**/tmp/**" # linux CI temp files
]
