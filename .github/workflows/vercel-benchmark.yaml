name: Vercel Framework Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# All three fixtures deploy to shared production aliases.
concurrency:
  group: live-vercel-benchmark
  cancel-in-progress: false

jobs:
  live-vercel:
    name: Live Vercel comparison
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report_available: ${{ steps.live-benchmark.outputs.report_available }}
      supported: ${{ steps.adapter-support.outputs.available }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEASURED_SHA: ${{ github.event.pull_request.head.sha }}
      VERCEL_TEAM: ${{ vars.VERCEL_TEAM || 'teyik0-team' }}

    steps:
      - name: Checkout Furin
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check adapter support
        id: adapter-support
        run: |
          if [ -f packages/core/src/adapter/vercel.ts ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate current PR
        id: pr-validation
        if: steps.adapter-support.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const current = pull.state === "open" && pull.head.sha === process.env.MEASURED_SHA;
            core.setOutput("current", String(current));
            if (!current) {
              core.setFailed("The PR was closed or updated while this benchmark was queued.");
            }

      - name: Require Vercel credentials
        if: >-
          steps.adapter-support.outputs.available == 'true' &&
          steps.pr-validation.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is required for the live benchmark." >&2
            exit 1
          fi

      - name: Checkout benchmark
        if: steps.adapter-support.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: Teyik0/furin-vercel-benchmarks
          ref: f124698be971e275a164c55a2fedcbc85256558c
          path: .benchmark
          persist-credentials: false

      - name: Cache bun
        if: steps.adapter-support.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-live-vercel-${{ hashFiles('bun.lock', '.benchmark/bun.lock') }}

      - name: Setup bun
        if: steps.adapter-support.outputs.available == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Furin
        if: steps.adapter-support.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Build and pack Furin HEAD
        if: steps.adapter-support.outputs.available == 'true'
        working-directory: packages/core
        run: |
          bun run build
          mkdir -p "$RUNNER_TEMP/furin-head-package"
          bun pm pack --destination "$RUNNER_TEMP/furin-head-package"
          furin_tarball="$(find "$RUNNER_TEMP/furin-head-package" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$furin_tarball"
          echo "FURIN_HEAD_TARBALL=$furin_tarball" >> "$GITHUB_ENV"

      - name: Install Furin benchmark package
        if: steps.adapter-support.outputs.available == 'true'
        working-directory: .benchmark
        run: |
          cd apps/furin
          bun pm pkg set \
            "dependencies.@teyik0/furin=$FURIN_HEAD_TARBALL" \
            dependencies.elysia=2.0.0-beta.16 \
            dependencies.evlog=2.29.0 \
            dependencies.exact-mirror=1.2.6 \
            dependencies.typebox=1.3.34
          cd ../..
          bun install --lockfile-only
          bun install --frozen-lockfile
          # Despite its legacy name, this verifies the installed tarball and creates benchmark nonces.
          bun run link:furin
          bunx playwright install --with-deps chromium

      - name: Run live benchmark
        id: live-benchmark
        if: >-
          steps.adapter-support.outputs.available == 'true' &&
          steps.pr-validation.outputs.current == 'true'
        working-directory: .benchmark
        env:
          BENCHMARK_ROUNDS: "3"
          BENCHMARK_WARM_SAMPLES: "5"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          bun run benchmark \
            --rounds "$BENCHMARK_ROUNDS" \
            --warm-samples "$BENCHMARK_WARM_SAMPLES" \
            2>&1 | tee "$RUNNER_TEMP/live-vercel-benchmark.log"
          benchmark_status=${PIPESTATUS[0]}
          set -e
          if [ "$benchmark_status" -eq 0 ]; then
            echo "report_available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'api-deployments-free-per-day' "$RUNNER_TEMP/live-vercel-benchmark.log"; then
            echo "report_available=false" >> "$GITHUB_OUTPUT"
            echo "Live benchmark skipped because the Vercel daily deployment quota is exhausted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$benchmark_status"

      - name: Prepare live report
        if: steps.live-benchmark.outputs.report_available == 'true'
        working-directory: .benchmark
        run: |
          reports=(reports/[0-9]*.md)
          test "${#reports[@]}" -eq 1
          cp "${reports[0]}" reports/summary.md
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nMeasured Furin commit: `%s`\n' "$MEASURED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live benchmark
        if: always() && steps.live-benchmark.outputs.report_available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: live-vercel-benchmark
          path: .benchmark/reports/

  comment:
    name: Publish live benchmark comparison
    needs: live-vercel
    if: >-
      needs.live-vercel.result == 'success' &&
      needs.live-vercel.outputs.supported == 'true' &&
      needs.live-vercel.outputs.report_available == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download live benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-vercel-benchmark
          path: ${{ runner.temp }}/live-vercel-benchmark

      - name: Publish live results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MEASURED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_PATH: ${{ runner.temp }}/live-vercel-benchmark/summary.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- furin-live-vercel-benchmark-report -->";
            const pullNumber = Number(process.env.PR_NUMBER);
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8").trim();
            const measuredSha = process.env.MEASURED_SHA;
            const body = `${marker}\n${report}\n\nMeasured Furin commit: \`${measuredSha}\`\n\nInformational live measurements, not a deterministic performance budget.\n\n[View live benchmark run and raw measurements](${process.env.RUN_URL})\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== "open" || pull.head.sha !== measuredSha) {
              core.info("Skipping live results for a closed or updated PR.");
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullNumber,
                body,
              });
            }
