name: Vercel Framework Benchmark

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional PR number (select its head branch above; trusted same-repository PRs only)
        type: string
        required: false
      rounds:
        description: Deployment rounds per framework
        required: false
        default: "3"
      warm_samples:
        description: Warm samples per scenario and round
        required: false
        default: "5"

permissions:
  contents: read

# All three fixtures deploy to shared production aliases.
concurrency:
  group: live-vercel-benchmark
  cancel-in-progress: false

jobs:
  live-vercel:
    name: Live Vercel comparison
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TEAM: ${{ vars.VERCEL_TEAM || 'teyik0-team' }}

    steps:
      - name: Validate benchmark PR
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        with:
          script: |
            if (!/^[1-9]\d*$/.test(process.env.PR_NUMBER)) {
              core.setFailed("pull_request must be a positive PR number.");
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.state !== "open" ||
                pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pull.head.sha !== context.sha) {
              core.setFailed("Select the current head branch of an open, trusted same-repository PR.");
            }

      - name: Require Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is required for the live benchmark." >&2
            exit 1
          fi

      - name: Checkout Furin
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout benchmark
        uses: actions/checkout@v7
        with:
          repository: Teyik0/furin-vercel-benchmarks
          ref: da052573470d91caf84e191332516c40f027c899
          path: .benchmark
          persist-credentials: false

      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-live-vercel-${{ hashFiles('bun.lock', '.benchmark/bun.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Furin
        run: bun install --frozen-lockfile

      - name: Build and link Furin
        working-directory: packages/core
        run: |
          bun run build
          bun link

      - name: Install benchmark
        working-directory: .benchmark
        run: |
          bun install --frozen-lockfile
          bun run link:furin
          bunx playwright install --with-deps chromium

      - name: Run live benchmark
        working-directory: .benchmark
        env:
          BENCHMARK_ROUNDS: ${{ inputs.rounds || '3' }}
          BENCHMARK_WARM_SAMPLES: ${{ inputs.warm_samples || '5' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bun run benchmark \
            --rounds "$BENCHMARK_ROUNDS" \
            --warm-samples "$BENCHMARK_WARM_SAMPLES"

      - name: Prepare live report
        working-directory: .benchmark
        run: |
          reports=(reports/[0-9]*.md)
          test "${#reports[@]}" -eq 1
          cp "${reports[0]}" reports/summary.md
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\nMeasured Furin commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-vercel-benchmark
          path: .benchmark/reports/

  comment:
    name: Publish live benchmark comparison
    needs: live-vercel
    if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download live benchmark report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-vercel-benchmark
          path: ${{ runner.temp }}/live-vercel-benchmark

      - name: Publish live results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          REPORT_PATH: ${{ runner.temp }}/live-vercel-benchmark/summary.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- furin-live-vercel-benchmark-report -->";
            const pullNumber = Number(process.env.PR_NUMBER);
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8").trim();
            const body = `${marker}\n${report}\n\nMeasured Furin commit: \`${context.sha}\`\n\nInformational live measurements, not a deterministic performance budget.\n\n[View live benchmark run and raw measurements](${process.env.RUN_URL})\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== "open" || pull.head.sha !== context.sha) {
              core.info("Skipping live results for a closed or updated PR.");
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullNumber,
                body,
              });
            }
