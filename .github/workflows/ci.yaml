name: Workflow - CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  distributed-sync:
    name: Distributed sync validation
    uses: ./.github/workflows/distributed-sync-validation.yaml

  build:
    name: Workflow - CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint & Format Check
        run: bun run ultracite check

      - name: Build
        run: bun run build

      - name: Type Check
        run: bun run tscheck

      - name: Test
        run: bun run test

      - name: HMR Browser Conformance
        working-directory: packages/core
        run: bun run test:webview

      - name: Knip
        run: bun run knip

      - name: Fetch main branch
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch origin main
          git branch main origin/main

      - name: React Doctor (main)
        if: github.ref == 'refs/heads/main'
        run: bunx react-doctor -y --annotations

      - name: React Doctor (PR)
        if: github.ref != 'refs/heads/main'
        run: bunx react-doctor -y --diff main --annotations

      - name: Publish Preview
        working-directory: packages/core
        if: github.event_name == 'pull_request'
        run: bunx pkg-pr-new publish

  vercel-benchmark:
    name: Vercel framework benchmark
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Furin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Teyik0/furin-vercel-benchmarks
          ref: 7b432a956173abbea49fb6e9c84fdac374d4c730
          path: .benchmark
          persist-credentials: false

      - name: Cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-vercel-benchmark-${{ hashFiles('bun.lock', '.benchmark/bun.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Furin
        run: bun install --frozen-lockfile

      - name: Build and link Furin HEAD
        working-directory: packages/core
        run: |
          bun run build
          bun link

      - name: Install benchmark
        working-directory: .benchmark
        run: bun install --frozen-lockfile

      - name: Validate framework fixtures
        working-directory: .benchmark
        run: |
          bun run link:furin
          bun run build
          bun run typecheck
          bun test
          bun scripts/local-report.ts "$RUNNER_TEMP/vercel-benchmark-head.json"

      - name: Check baseline support
        id: benchmark-baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:packages/core/src/adapter/vercel.ts"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build baseline benchmark
        if: steps.benchmark-baseline.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/furin-benchmark-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/furin-benchmark-base"
          bun install --frozen-lockfile
          cd "$RUNNER_TEMP/furin-benchmark-base/packages/core"
          bun run build
          bun link
          cd "$GITHUB_WORKSPACE/.benchmark"
          bun install --frozen-lockfile --force
          bun run link:furin
          bun run --cwd apps/furin build
          bun scripts/local-report.ts "$RUNNER_TEMP/vercel-benchmark-base.json"

      - name: Enforce benchmark budgets
        if: steps.benchmark-baseline.outputs.available == 'true'
        working-directory: .benchmark
        run: |
          set +e
          bun scripts/compare-local-reports.ts \
            "$RUNNER_TEMP/vercel-benchmark-base.json" \
            "$RUNNER_TEMP/vercel-benchmark-head.json" \
            "$RUNNER_TEMP/vercel-benchmark.md"
          comparison_status=$?
          set -e
          {
            echo '<!-- furin-vercel-benchmark-report -->'
            cat "$RUNNER_TEMP/vercel-benchmark.md"
          } > "$RUNNER_TEMP/vercel-benchmark-with-marker.md"
          mv "$RUNNER_TEMP/vercel-benchmark-with-marker.md" "$RUNNER_TEMP/vercel-benchmark.md"
          cat "$RUNNER_TEMP/vercel-benchmark.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$comparison_status"

      - name: Bootstrap benchmark baseline
        if: steps.benchmark-baseline.outputs.available != 'true'
        run: |
          {
            echo '<!-- furin-vercel-benchmark-report -->'
            echo "## Vercel framework benchmark"
            echo
            echo "The target branch does not contain the Vercel adapter yet. This PR establishes the external benchmark baseline."
            echo
            bun -e '
              const head = await Bun.file(`${process.env.RUNNER_TEMP}/vercel-benchmark-head.json`).json();
              console.log("| Metric | Base | Head |");
              console.log("|---|---|---:|");
              for (const key of ["serverHandlerBytes", "serverBootstrapBytes", "clientJavaScriptBytes", "clientCssBytes", "clientAssetCount"]) {
                console.log(`| ${key} | No baseline | ${head[key]} |`);
              }
            '
          } | tee "$RUNNER_TEMP/vercel-benchmark.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report benchmark infrastructure failure
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/vercel-benchmark.md" ]; then
            {
              echo '<!-- furin-vercel-benchmark-report -->'
              echo '## Vercel framework benchmark'
              echo
              echo 'No comparison was produced. Benchmark setup or validation failed; inspect the workflow logs. This is not a passing performance result.'
            } | tee "$RUNNER_TEMP/vercel-benchmark.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vercel-framework-benchmark
          path: |
            ${{ runner.temp }}/vercel-benchmark-head.json
            ${{ runner.temp }}/vercel-benchmark-base.json
            ${{ runner.temp }}/vercel-benchmark.md
          if-no-files-found: ignore

  performance:
    name: Performance budgets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build PR performance report
        run: bun scripts/build-performance-report.ts "$GITHUB_WORKSPACE" "$RUNNER_TEMP/furin-performance/head.json"

      - name: Check baseline support
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git grep --quiet -- '--analyze' "$BASE_SHA" -- packages/core/src/cli/index.ts; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build baseline performance report
        if: steps.baseline.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/furin-base" "$BASE_SHA"
          bun scripts/build-performance-report.ts "$RUNNER_TEMP/furin-base" "$RUNNER_TEMP/furin-performance/base.json"

      - name: Enforce performance budgets
        if: steps.baseline.outputs.available == 'true'
        run: |
          set +e
          bun scripts/compare-performance-reports.ts \
            "$RUNNER_TEMP/furin-performance/base.json" \
            "$RUNNER_TEMP/furin-performance/head.json" \
            "$RUNNER_TEMP/furin-performance/budgets.md"
          comparison_status=$?
          set -e
          cat "$RUNNER_TEMP/furin-performance/budgets.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$comparison_status"

      - name: Bootstrap performance baseline
        if: steps.baseline.outputs.available != 'true'
        run: |
          {
            echo '<!-- furin-performance-report -->'
            echo "## Furin performance budgets"
            echo
            echo "The target branch cannot produce a compatible metafile yet. This PR establishes the baseline; comparisons become blocking once it lands."
          } | tee "$RUNNER_TEMP/furin-performance/budgets.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Install benchmark tools
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: hyperfine,oha

      - name: Collect runtime diagnostics
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/furin-performance/profiles"
          hyperfine \
            --export-json "$RUNNER_TEMP/furin-performance/startup.json" \
            --runs 10 \
            --style basic \
            --warmup 2 \
            "bun scripts/probe-server-startup.ts examples/weather/.furin/build/bun/server" \
            | tee "$RUNNER_TEMP/furin-performance/startup.txt"

          bun run --cwd examples/weather furin build --target bun
          client_asset="$(find examples/weather/.furin/build/bun/client -maxdepth 1 -name '*.js' -print -quit)"
          client_url="http://127.0.0.1:32110/_client/$(basename "$client_asset")"
          BUN_OPTIONS="--cpu-prof-md --cpu-prof-dir=$RUNNER_TEMP/furin-performance/profiles --heap-prof-md --heap-prof-dir=$RUNNER_TEMP/furin-performance/profiles" \
            PORT=32110 \
            bun -e 'setTimeout(() => process.exit(0), 10_000); await import("./examples/weather/.furin/build/bun/server.js");' \
            > "$RUNNER_TEMP/furin-performance/server.log" 2>&1 &
          server_pid=$!

          ready=false
          for attempt in $(seq 1 200); do
            if curl --silent --output /dev/null "$client_url"; then
              ready=true
              break
            fi
            sleep 0.05
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/furin-performance/server.log"
            exit 1
          fi

          oha --json -z 5s -c 20 "$client_url" > "$RUNNER_TEMP/furin-performance/load.json"
          wait "$server_pid"

          {
            echo
            echo "## Runtime diagnostics"
            echo
            echo "Startup and load profiles are informational while runner variance is being established."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/furin-performance/startup.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: furin-performance
          path: ${{ runner.temp }}/furin-performance
