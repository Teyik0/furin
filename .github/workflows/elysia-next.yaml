name: Workflow - Elysia rc

# Furin's Elysia peer is a range. This runs the core tests against the
# latest `elysia@rc` so upcoming RCs break CI before they break users.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests on elysia@rc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Point the workspace catalog at elysia@rc
        run: |
          jq '.catalog.elysia = "rc"' package.json > package.next.json
          mv package.next.json package.json

      - name: Install packages
        run: bun install

      - name: Show resolved Elysia
        run: bun why elysia

      - name: Build core
        run: bun run --filter '@teyik0/furin' build

      - name: Test core
        working-directory: packages/core
        run: bun run test
