name: Performance PR comment

on:
  workflow_run:
    workflows: ["Workflow - CI"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: performance-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    name: Update performance results comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    steps:
      - name: Download performance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: furin-performance
          path: ${{ runner.temp }}/furin-performance
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish performance results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/furin-performance/budgets.md
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- furin-performance-report -->";
            const reportPath = process.env.REPORT_PATH;
            const runUrl = process.env.RUN_URL;
            const workflowRun = context.payload.workflow_run;
            const pullRequest = workflowRun.pull_requests[0];
            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequest.number,
            });

            if (currentPullRequest.head.sha !== workflowRun.head_sha) {
              core.info("Skipping an outdated performance report.");
              return;
            }

            if (!fs.existsSync(reportPath)) {
              core.setFailed("The downloaded artifact does not contain budgets.md.");
              return;
            }
            const report = fs.readFileSync(reportPath, "utf8").trim();
            const body = `${report}\n\n[View performance workflow run](${runUrl})\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );

            const { data: latestPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequest.number,
            });
            if (latestPullRequest.head.sha !== workflowRun.head_sha) {
              core.info("Skipping a performance report superseded before publication.");
              return;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullRequest.number,
                body,
              });
            }
