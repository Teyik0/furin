name: Workflow - CD

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  distributed-sync:
    name: Distributed sync validation
    uses: ./.github/workflows/distributed-sync-validation.yaml

  publish-npm:
    name: Workflow - CD
    needs: distributed-sync
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Select release package
        id: release
        run: bun scripts/release-target.ts select

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint & Format Check
        run: bun run ultracite check

      - name: Build
        run: bun run build

      - name: Type Check
        run: bun run tscheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: React Doctor
        run: bunx react-doctor -y --scope full

      - name: Verify publication prerequisites
        run: bun scripts/release-target.ts verify

      - name: Verify packed scaffolder
        if: steps.release.outputs.directory == 'apps/scaffolder'
        run: bun test apps/scaffolder/tests/package.test.ts
        env:
          FURIN_SCAFFOLDER_RELEASE_SMOKE: "1"

      - name: Publish selected package
        working-directory: ${{ steps.release.outputs.directory }}
        run: bun publish --access public --tag "${{ steps.release.outputs.dist_tag }}"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
