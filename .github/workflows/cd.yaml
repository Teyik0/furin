name: Workflow - CD

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write

jobs:
  distributed-sync:
    name: Distributed sync validation
    uses: ./.github/workflows/distributed-sync-validation.yaml

  publish-npm:
    name: Workflow - CD
    needs: distributed-sync
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: Cache bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint & Format Check
        run: bun run ultracite check

      - name: Build
        run: bun run build

      - name: Type Check
        run: bun run tscheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: React Doctor
        run: bunx react-doctor --diff false

      - name: Setup auth for Bun
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc

      - name: Publish core
        working-directory: packages/core
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
