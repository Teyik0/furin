name: Distributed sync validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  distributed-sync:
    name: Distributed sync validation
    runs-on: ubuntu-latest
    env:
      FURIN_SYNC_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FURIN_SYNC_REDIS_URL: redis://127.0.0.1:6379
    # Digest update process: review both upstream releases, update both digests together,
    # and run this workflow through CI before merging.
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Test PostgreSQL adapter
        run: bun test packages/core/tests/client/sync/adapters/postgres-sync-adapter.test.ts

      - name: Test Redis adapter and notifier
        run: bun test packages/core/tests/client/sync/adapters/redis-sync.test.ts
